[versions]
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
gradlePlugin = "8.5.2"
compose = "1.7.4"
composeMaterial3 = "1.3.0"
actCompose = "1.9.3"
hilt = "2.49"
hiltJetpack = "1.2.0"
coroutines = "1.8.1"
orbit = "6.1.0"
navigationCompose = "2.8.4"
kotlinxSerialization = "1.7.3"
lifecycleRuntimeCompose = "2.8.7"
datastore = "1.1.1"
workManager = "2.9.1"
room = "2.6.1"
mediapipeTasksText = "0.10.14"
playAssetDelivery = "2.2.2"
compileSdk = "34"
targetSdk = "34"
minSdk = "24"

[libraries]
androidx-ktxCore = "androidx.core:core-ktx:1.13.1"
androidx-splashscreen = "androidx.core:core-splashscreen:1.0.1"

androidx-compose-runtime          = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
androidx-compose-ui               = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-foundation       = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
androidx-compose-uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
androidx-compose-uiTooling        = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-activity         = { module = "androidx.activity:activity-compose", version.ref = "actCompose" }
material3                         = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }

hilt-base             = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-core             = { module = "com.google.dagger:hilt-core", version.ref = "hilt" }
hilt-compiler         = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-androidxCompiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltJetpack" }
hilt-navigationCompose = "androidx.hilt:hilt-navigation-compose:1.2.0"

orbit-core    = { module = "org.orbit-mvi:orbit-core", version.ref = "orbit" }
orbit-vm      = { module = "org.orbit-mvi:orbit-viewmodel", version.ref = "orbit" }
orbit-compose = { module = "org.orbit-mvi:orbit-compose", version.ref = "orbit" }
orbit-test    = { module = "org.orbit-mvi:orbit-test", version.ref = "orbit" }

androidx-navigation-compose       = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-core        = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json        = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-process       = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycleRuntimeCompose" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }

androidx-room-runtime  = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx      = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# On-device Tier-2 text embedding (:text-embed) — the native .so runtime this pulls in ships
# in the base APK unconditionally; only the ~25MB model is deferred, via Play Asset Delivery.
mediapipe-tasksText = { module = "com.google.mediapipe:tasks-text", version.ref = "mediapipeTasksText" }
# Play Asset Delivery: on-demand download of the model pack (:model_pack).
play-assetDelivery-ktx = { module = "com.google.android.play:asset-delivery-ktx", version.ref = "playAssetDelivery" }

coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

timber = "com.jakewharton.timber:timber:5.0.1"

coreLibraryDesugaring = "com.android.tools:desugar_jdk_libs:2.0.4"

junit                      = "junit:junit:4.13.2"
androidx-test-junitExt     = "androidx.test.ext:junit:1.2.1"
androidx-test-runner       = "androidx.test:runner:1.6.2"
play-services-location     = "com.google.android.gms:play-services-location:21.3.0"
androidx-test-espressoCore = "androidx.test.espresso:espresso-core:3.6.1"

# Plugin classpaths (consumed by build-logic)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "gradlePlugin" }
kotlin-gradlePlugin  = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeCompilerGradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin     = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin    = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "gradlePlugin" }
android-library     = { id = "com.android.library", version.ref = "gradlePlugin" }
android-assetPack   = { id = "com.android.asset-pack", version.ref = "gradlePlugin" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt         = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# Local convention plugin IDs (resolved via build-logic composite)
reset-androidApplicationCompose = "reset.android.application.compose:unspecified"
reset-androidLibrary            = "reset.android.library:unspecified"
reset-androidLibraryCompose     = "reset.android.library.compose:unspecified"
reset-androidFeatureCompose     = "reset.android.feature.compose:unspecified"
reset-hilt                      = "reset.hilt:unspecified"
